<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <title>getPlanes</title>
    <style>
        #map { height: 70vh; }

        /* Leaflet gives divIcons a white box by default */
        .plane-marker { background: none; border: none; }

        .plane-icon {
            width: 28px;
            height: 28px;
            transition: transform 0.5s ease;
        }
        .plane-icon svg {
            display: block;
            fill: #0b5cd5;
            stroke: #fff;
            stroke-width: 1;
            paint-order: stroke;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.4));
        }
        .plane-icon.on-ground svg { fill: #777; }
    </style>
</head>
<body>
    <button id="fetchAll">Load planes</button>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    

    <script src="model.js"></script>
</body>
</html>
